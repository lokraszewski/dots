- name: Gather facts
  ansible.builtin.setup:

- name: Ensure git config directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.config/git"
    state: directory
    mode: "0755"

# git writes --global to ~/.gitconfig whenever that file exists, and only falls
# back to the XDG path when it does not. Migrating must therefore happen before
# any git_config task below, or those tasks recreate ~/.gitconfig.
- name: Migrate gitconfig to XDG location
  ansible.builtin.command:
    cmd: mv {{ ansible_facts['user_dir'] }}/.gitconfig {{ ansible_facts['user_dir'] }}/.config/git/config
    creates: "{{ ansible_facts['user_dir'] }}/.config/git/config"
    removes: "{{ ansible_facts['user_dir'] }}/.gitconfig"

- name: Deploy gitaliases
  ansible.builtin.copy:
    src: gitaliases
    dest: "{{ ansible_facts['user_dir'] }}/.config/git/aliases"
    mode: "0644"

- name: Include gitaliases from gitconfig
  community.general.git_config:
    name: include.path
    value: "~/.config/git/aliases"
    scope: global

- name: Remove pre-XDG gitaliases
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.gitaliases"
    state: absent

- name: Install packages
  ansible.builtin.include_tasks:
    file: "install/{{ ansible_facts['distribution'] }}.yml"
  tags:
    - packages
    - git

- name: Validate git identity
  ansible.builtin.assert:
    that:
      - git_identity.name is defined
      - git_identity.email is defined
      - git_identity.name | length > 0
      - git_identity.email | length > 0
    fail_msg: "git identity for this host must be set in host_vars/<inventory_hostname>/vault.yml under git_identity."

- name: Configure git identity
  community.general.git_config:
    name: user.name
    value: "{{ git_identity.name }}"
    scope: global

- name: Configure git email
  community.general.git_config:
    name: user.email
    value: "{{ git_identity.email }}"
    scope: global

- name: Validate git signing key
  ansible.builtin.assert:
    that:
      - git_identity.signing_key is defined
      - git_identity.signing_key | length > 0
    fail_msg: "git_identity.signing_key must be set in host_vars/<inventory_hostname>/vault.yml (path to .pub file, e.g. ~/.ssh/id_ed25519.pub)"

- name: Configure signing key path
  community.general.git_config:
    name: user.signingkey
    value: "{{ git_identity.signing_key }}"
    scope: global

- name: Configure SSH signing format
  community.general.git_config:
    name: gpg.format
    value: ssh
    scope: global

- name: Sign commits by default
  community.general.git_config:
    name: commit.gpgsign
    value: "true"
    scope: global

- name: Sign tags by default
  community.general.git_config:
    name: tag.gpgsign
    value: "true"
    scope: global

- name: Read SSH public key for allowed signers
  ansible.builtin.slurp:
    src: "{{ git_identity.signing_key | expanduser }}"
  register: signing_pubkey

- name: Write allowed signers file
  ansible.builtin.copy:
    content: "{{ git_identity.email }} {{ signing_pubkey.content | b64decode | trim }}\n"
    dest: "{{ ansible_facts['user_dir'] }}/.ssh/allowed_signers"
    mode: "0644"

- name: Configure allowed signers file
  community.general.git_config:
    name: gpg.ssh.allowedSignersFile
    value: "~/.ssh/allowed_signers"
    scope: global
