- name: Gather facts
  ansible.builtin.setup:

- name: Install packages
  ansible.builtin.include_tasks:
    file: "install/{{ ansible_facts['distribution'] }}.yml"
  tags:
    - packages
    - fonts

- name: Write terminal font recommendation
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.terminal-font"
    content: |
      {{ terminal_font_name }}
      Recommended for:
      - Fish shell
      - tmux
      - starship prompt
  tags:
    - fonts

