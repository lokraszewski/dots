- name: Gather facts
  ansible.builtin.setup:

- name: Install packages
  ansible.builtin.include_tasks:
    file: "install/{{ ansible_facts['distribution'] }}.yml"
  tags:
    - packages
    - fonts

- name: Write terminal font recommendation
  ansible.builtin.copy:
    dest: "{{ ansible_facts['user_dir'] }}/.config/terminal-font"
    content: |
      {{ terminal_font_name }}
      Recommended for:
      - zsh
      - tmux
      - starship prompt
    mode: "0644"
  tags:
    - fonts

- name: Remove pre-XDG terminal font note
  ansible.builtin.file:
    path: "{{ ansible_facts['user_dir'] }}/.terminal-font"
    state: absent
  tags:
    - fonts
