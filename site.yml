- name: Configure baseline system settings
  hosts: all
  roles:
    - role: base
      tags:
        - base
        - baseline
    - role: font
      tags:
        - fonts
    - role: foot
      tags:
        - foot
        - fonts

- name: Configure host git identity
  hosts: dev
  tags:
    - git
    - identity
  roles:
    - git

- name: Configure shared CLI tools and shell helpers
  hosts: cli
  tags:
    - cli
    - shell
  roles:
    - cli
    - role: shell
      tags:
        - zsh
    - role: zsh
      tags:
        - zsh
    - role: tmux
      tags:
        - tmux

- name: Configure Go development tools
  hosts: dev_go
  tags:
    - dev-go
    - go
  roles:
    - dev_go

- name: Configure dev tools (cloud, k8s, IaC)
  hosts: dev
  tags:
    - dev
  roles:
    - dev

- name: Configure GUI applications
  hosts: desktop
  tags:
    - apps
    - gui
    - personal
    - personal-apps
    - work
    - work-apps
  roles:
    - apps
